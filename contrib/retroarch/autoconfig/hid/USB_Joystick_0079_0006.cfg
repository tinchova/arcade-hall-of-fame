# Joystick USB genérico "Lion King" (Microntek "USB Joystick", DragonRise,
# VID 0x0079 = 121, PID 0x0006 = 6) con el driver de joypad "hid" de
# RetroArch en macOS. Ver docs/JOYSTICK.md.
#
# input_device lleva los 10 espacios del final: el driver hid usa el nombre
# del producto tal cual (kIOHIDProductKey) y la autoconfiguración lo compara
# exacto. Con nombre y VID/PID coincide mejor (afinidad 50) que los perfiles
# de otros mandos con el mismo VID/PID (Retrolink N64, DragonRise Zero Delay:
# solo VID/PID, afinidad 30).
#
# Requiere RetroArch parcheado con contrib/macos/parchear_retroarch.sh: sin el
# parche, el driver hid toma 0079:0006 como "DragonRise ZeroDelay Encoder",
# con otra numeración y sin ejes, y este perfil no sirve.
#
# Índices del driver hid (lectura genérica de IOKit): los botones son los usos
# 1..12 de la página Button, en orden, empezando en 0 (botón físico N = índice
# N-1). Ejes: X = 0, Y = 1, Z = 4, Rz = 5. Con la luz ANALOG prendida la cruz
# es el hat (h0), la palanca izquierda los ejes 0/1 y la derecha los ejes 4/5;
# con la luz apagada la cruz y la palanca izquierda mandan los ejes 0/1 y la
# palanca derecha los botones 1 a 4.
#
# Estilo PlayStation: 3 (abajo) = B, 2 (derecha) = A, 4 (izquierda) = Y,
# 1 (arriba) = X.
input_driver = "hid"
input_device = "USB Joystick          "
input_device_display_name = "Lion King USB Joystick"
input_vendor_id = "121"
input_product_id = "6"

input_x_btn = "0"
input_a_btn = "1"
input_b_btn = "2"
input_y_btn = "3"
input_l_btn = "4"
input_r_btn = "5"
input_l2_btn = "6"
input_r2_btn = "7"
input_select_btn = "8"
input_start_btn = "9"

input_up_axis = "-1"
input_down_axis = "+1"
input_left_axis = "-0"
input_right_axis = "+0"
input_up_btn = "h0up"
input_down_btn = "h0down"
input_left_btn = "h0left"
input_right_btn = "h0right"

input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
input_r_x_plus_axis = "+4"
input_r_x_minus_axis = "-4"
input_r_y_plus_axis = "+5"
input_r_y_minus_axis = "-5"


input_x_btn_label = "1 (arriba)"
input_a_btn_label = "2 (derecha)"
input_b_btn_label = "3 (abajo)"
input_y_btn_label = "4 (izquierda)"
input_l_btn_label = "L1"
input_r_btn_label = "R1"
input_l2_btn_label = "L2"
input_r2_btn_label = "R2"
input_select_btn_label = "SELECT (9)"
input_start_btn_label = "START (10)"
input_up_axis_label = "Cruz arriba"
input_down_axis_label = "Cruz abajo"
input_left_axis_label = "Cruz izquierda"
input_right_axis_label = "Cruz derecha"
input_l_x_plus_axis_label = "Palanca izquierda derecha"
input_l_x_minus_axis_label = "Palanca izquierda izquierda"
input_l_y_plus_axis_label = "Palanca izquierda abajo"
input_l_y_minus_axis_label = "Palanca izquierda arriba"
input_r_x_plus_axis_label = "Palanca derecha derecha"
input_r_x_minus_axis_label = "Palanca derecha izquierda"
input_r_y_plus_axis_label = "Palanca derecha abajo"
input_r_y_minus_axis_label = "Palanca derecha arriba"
